[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudserve-ai-support-system"
version = "0.1.0"
description = "IIT Roorkee PGP Forward Deployed Engineering Capstone: Production-Minded Support Automation System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "CloudServe Engineering Team"}
]
keywords = [
    "ai-support",
    "rag",
    "chromadb",
    "langgraph",
    "fastapi",
    "forward-deployed-engineering"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.5.1",
    "langchain>=0.1.13",
    "langchain-community>=0.0.29",
    "langchain-groq>=0.1.0",
    "langgraph>=0.0.30",
    "groq>=0.5.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.1",
    "jinja2>=3.1.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/cloudserve --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
